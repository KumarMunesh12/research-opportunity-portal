$kind: http-request
description: "Expected: 201 Created"
url: "{{baseUrl}}/api/opportunities"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "research_title": "Phishing Website Detection",
      "research_description": "Train a classifier that detects phishing URLs using lexical and host-based features.",
      "research_area": "Cyber Security",
      "faculty_name": "Dr. Nadia Rehman",
      "department": "Cyber Security",
      "required_skills": "Python, scikit-learn, Networking basics",
      "available_positions": 1,
      "application_deadline": "2026-12-10",
      "status": "Open"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Saved new ID as opportunityId3", function () {
          var json = pm.response.json();
          pm.expect(json.data.id).to.be.a("number");
          pm.collectionVariables.set("opportunityId3", json.data.id);
      });
    language: text/javascript
order: 3000
