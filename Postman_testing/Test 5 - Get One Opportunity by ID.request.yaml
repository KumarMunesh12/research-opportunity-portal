$kind: http-request
description: "Expected: 200 OK"
url: "{{baseUrl}}/api/opportunities/{{opportunityId1}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Correct opportunity returned", function () {
          pm.expect(pm.response.json().data.id).to.eql(Number(pm.collectionVariables.get("opportunityId1")));
      });
    language: text/javascript
order: 5000
