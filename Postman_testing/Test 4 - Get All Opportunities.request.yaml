$kind: http-request
description: "Expected: 200 OK"
url: "{{baseUrl}}/api/opportunities"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns at least 3 opportunities", function () {
          pm.expect(pm.response.json().data.length).to.be.at.least(3);
      });
    language: text/javascript
order: 4000
