$kind: http-request
description: "Expected: 201 Created"
url: "{{baseUrl}}/api/opportunities"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "research_title": "Congestion Control in 5G Networks",
      "research_description": "Compare TCP congestion control algorithms (Cubic, BBR) over simulated 5G links using ns-3.",
      "research_area": "Computer Networks",
      "faculty_name": "Dr. Sana Ahmed",
      "department": "Computer Science",
      "required_skills": "C++, ns-3, TCP/IP",
      "available_positions": 2,
      "application_deadline": "2026-12-01",
      "status": "Open"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Saved new ID as opportunityId1", function () {
          var json = pm.response.json();
          pm.expect(json.data.id).to.be.a("number");
          pm.collectionVariables.set("opportunityId1", json.data.id);
      });
    language: text/javascript
order: 1000
